    <!-- FIREBASE SERVICES BRIDGE (ES MODULE) -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nacira-sales-ai-2026';

        function getActiveFirebaseConfig() {
            try {
                const saved = localStorage.getItem('nacira_custom_firebase_config');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.apiKey && parsed.apiKey !== 'mock') return parsed;
                }
            } catch (e) {}

            if (typeof __firebase_config !== 'undefined') {
                try {
                    const parsed = JSON.parse(__firebase_config);
                    if (parsed && parsed.apiKey && parsed.apiKey !== 'mock') return parsed;
                } catch (e) {}
            }

            if (window.__firebase_config && window.__firebase_config.apiKey && window.__firebase_config.apiKey !== 'mock') {
                return window.__firebase_config;
            }

            return null;
        }

        let app = null;
        let auth = null;
        let db = null;

        function initializeFirebase(config) {
            if (!config || !config.apiKey || config.apiKey === 'mock') {
                return { isConfigured: false, reason: 'missing_or_mock_config' };
            }
            try {
                const existingApps = getApps();
                if (existingApps.length > 0) {
                    app = existingApps[0];
                } else {
                    app = initializeApp(config);
                }
                auth = getAuth(app);
                db = getFirestore(app);
                return { isConfigured: true, app, auth, db };
            } catch (err) {
                console.warn("[Firebase Bridge] Inisialisasi Firebase gagal:", err);
                return { isConfigured: false, error: err };
            }
        }

        const initialConfig = getActiveFirebaseConfig();
        const initStatus = initializeFirebase(initialConfig);

        window.firebaseServices = {
            app, auth, db, appId,
            isConfigured: initStatus.isConfigured,
            getActiveConfig: getActiveFirebaseConfig,
            reconfigure: (newConfig) => {
                try {
                    if (newConfig) {
                        localStorage.setItem('nacira_custom_firebase_config', JSON.stringify(newConfig));
                    } else {
                        localStorage.removeItem('nacira_custom_firebase_config');
                    }
                    const result = initializeFirebase(newConfig);
                    window.firebaseServices.app = app;
                    window.firebaseServices.auth = auth;
                    window.firebaseServices.db = db;
                    window.firebaseServices.isConfigured = result.isConfigured;
                    window.dispatchEvent(new CustomEvent('firebase-reconfigured', { detail: result }));
                    return result;
                } catch (e) {
                    return { isConfigured: false, error: e };
                }
            },
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, getDocs
        };

        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo, Component } = React;

        // =========================================================================
        // 1. SINGLE SOURCE OF TRUTH: MASTER PRICELIST & SPECIFICATIONS (2026)
        // =========================================================================
        const PRICE_MASTER = {
            kitchenBandung: [
                { material: "Blockboard 18mm", price: 2000000, display: "Rp 2,0jt/m" },
                { material: "Multipleks Plywood 18mm", price: 2500000, display: "Rp 2,5jt/m" },
                { material: "PVC Board Waterproof", price: 4100000, display: "Rp 4,1jt/m" },
                { material: "Alumunium & ACP", price: 3300000, display: "Rp 3,3jt/m" },
                { material: "Duco Multipleks", price: 4500000, display: "Rp 4,5jt/m" }
            ],
            kitchenJabodetabek: [
                { material: "Blockboard Minimalis", price: 2300000, display: "Rp 2,3jt/m" },
                { material: "Multipleks Plywood 18mm", price: 2600000, display: "Rp 2,6jt/m" },
                { material: "PVC Board Waterproof", price: 4100000, display: "Rp 4,1jt/m" },
                { material: "Duco Minimalis", price: 4000000, display: "Rp 4,0jt/m" }
            ],
            wardrobe: [
                { material: "Lemari Minimalis Blockboard (Bandung)", price: 2300000, display: "Rp 2,3jt/m" },
                { material: "Lemari Minimalis Blockboard (Jabodetabek)", price: 2400000, display: "Rp 2,4jt/m" },
                { material: "Finishing HPL / Melaminto / Duco Klasik", price: null, display: "Custom Sesuai Desain" }
            ],
            livingRoom: [
                { item: "Backdrop TV Blockboard", price: 2100000, display: "Mulai Rp 2,1jt/m" },
                { item: "Partisi Minimalis Dua Sisi", price: 2100000, display: "Mulai Rp 2,1jt/m" },
                { item: "Wallpanel WPC Modern", price: 850000, display: "Mulai Rp 850rb/m" }
            ],
            services: [
                "Gratis Konsultasi",
                "Gratis Desain 3D",
                "Gratis Survey Area Bandung & Jabodetabek",
                "Garansi Pemeliharaan 6 Bulan"
            ],
            specifications: "Blockboard 18mm (area kering), Multipleks Plywood 18mm (struktural tinggi), PVC Board Waterproof (anti air/lembap area bawah sink), Alumunium & ACP (anti rayap)."
        };

        // Default Google Gemini AI configuration
        const DEFAULT_GEMINI_API_KEY = 'REMOVED_SECRET';
        const DEFAULT_GEMINI_MODEL = 'gemini-3.6-flash';

        // =========================================================================
        // 2. CORE UTILITIES & PHONE NORMALIZATION
        // =========================================================================
        const Utils = {
            _idCounter: 0,
            generateId: (prefix = 'id') => {
                Utils._idCounter++;
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    return `${prefix}_${crypto.randomUUID()}`;
                }
                const rand = Math.random().toString(36).substring(2, 10);
                const ts = Date.now().toString(36);
                return `${prefix}_${ts}_${rand}_${Utils._idCounter}`;
            },

            getAsiaJakartaDate: (dateObj = new Date()) => {
                try {
                    const formatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit' });
                    return formatter.format(dateObj);
                } catch (e) {
                    return dateObj.toISOString().slice(0, 10);
                }
            },

            getAsiaJakartaIso: () => {
                return new Date().toISOString();
            },

            addDaysToDate: (dateStr, days) => {
                try {
                    const d = new Date(dateStr + 'T00:00:00+07:00');
                    d.setDate(d.getDate() + days);
                    return Utils.getAsiaJakartaDate(d);
                } catch (e) {
                    return dateStr;
                }
            }
        };

        const PhoneUtils = {
            normalize: (phone) => {
                if (!phone || typeof phone !== 'string') return '';
                let cleaned = phone.trim().replace(/[^0-9+]/g, '');

                if (!cleaned) return '';

                if (cleaned.startsWith('+')) {
                    const withoutPlus = cleaned.slice(1);
                    // Koreksi typo Indonesia +6208... -> 628...
                    if (withoutPlus.startsWith('6208')) {
                        const fixed = '628' + withoutPlus.slice(4);
                        return (fixed.length >= 8 && fixed.length <= 16) ? fixed : '';
                    }
                    // Nomor internasional non-Indonesia (+65, +1, +60, dll) — TIDAK diubah ke +62
                    const digits = withoutPlus.replace(/[^0-9]/g, '');
                    return (digits.length >= 7 && digits.length <= 16) ? digits : '';
                }

                // Nomor Indonesia lokal
                if (cleaned.startsWith('6208')) {
                    cleaned = '628' + cleaned.slice(4);
                } else if (cleaned.startsWith('08')) {
                    cleaned = '62' + cleaned.slice(1);
                } else if (cleaned.startsWith('8') && cleaned.length >= 9 && cleaned.length <= 13) {
                    cleaned = '62' + cleaned;
                }

                const digitsOnly = cleaned.replace(/[^0-9]/g, '');
                if (digitsOnly.length < 8 || digitsOnly.length > 16) {
                    return '';
                }
                return digitsOnly;
            },

            formatDisplay: (phoneRaw, phoneNormalized) => {
                if (!phoneRaw && !phoneNormalized) return 'Belum diisi';
                return phoneRaw || (phoneNormalized ? '+' + phoneNormalized : 'Belum diisi');
            },

            buildWaLink: (phoneNormalized, clientName = '') => {
                if (!phoneNormalized) return null;
                const encoded = clientName ? encodeURIComponent(clientName) : '';
                const text = encoded
                    ? 'Halo%20' + encoded + ',%20kami%20dari%20Nacira%20Studio%20ingin%20mengonfirmasi%20terkait%20rencana%20interior%20Anda...'
                    : '';
                return text
                    ? 'https://wa.me/' + phoneNormalized + '?text=' + text
                    : 'https://wa.me/' + phoneNormalized;
            }
        };

        // =========================================================================
        // 3. STORAGE SERVICE & MIGRATION SERVICE (MULTI-TENANT & LWW)
        // =========================================================================
        const StorageService = {
            getUserKey: (baseKey, userId) => {
                const tenant = userId ? `user_${userId}` : 'local_default';
                return `${baseKey}_${tenant}`;
            },

            getItem: (key, fallback = null) => {
                try {
                    const item = localStorage.getItem(key);
                    if (!item) return fallback;
                    try {
                        return JSON.parse(item);
                    } catch (parseErr) {
                        // Data rusak: simpan ke kunci pemulihan, JANGAN timpa dengan fallback diam-diam
                        const recoveryKey = key + '_corrupted_backup_' + Date.now();
                        try { localStorage.setItem(recoveryKey, item); } catch (e) { /* ignore if storage full */ }
                        console.error('[StorageService] Gagal parse JSON key "' + key + '". Data rusak disimpan di: ' + recoveryKey, parseErr);
                        return fallback;
                    }
                } catch (e) {
                    console.error('[StorageService] Gagal membaca key "' + key + '":', e);
                    return fallback;
                }
            },

            setItem: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return { success: true };
                } catch (e) {
                    console.error('[StorageService] Gagal menyimpan key "' + key + '":', e);
                    const isQuota = (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
                    return { success: false, isQuotaExceeded: isQuota, error: e.message };
                }
            },

            removeItem: (key) => {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (e) {
                    return false;
                }
            }
        };

        const MigrationService = {
            BASE_KEYS: {
                CRM_LEADS: 'nacira_crm_leads_v2',
                FOLLOWUP_TASKS: 'nacira_followup_tasks_v2',
                TOMBSTONE_LEADS: 'nacira_tombstone_leads_v2',
                TOMBSTONE_TASKS: 'nacira_tombstone_tasks_v2',
                CRM_BACKUP_V1: 'nacira_crm_leads_backup_v1',
                FOLLOWUP_BACKUP_V1: 'nacira_followup_tasks_backup_v1',
                PRE_MIGRATION_BACKUP: 'nacira_pre_migration_backup'
            },

            _LEAD_STATUS_MAP: {
                'Prospek': 'Prospek / Survey',
                'Survey': 'Prospek / Survey',
                'Prospek / Survey': 'Prospek / Survey',
                'Desain': 'Design Review',
                'Design': 'Design Review',
                'Design Review': 'Design Review',
                'Closing': 'Closing / DP Masuk',
                'DP Masuk': 'Closing / DP Masuk',
                'Closing / DP Masuk': 'Closing / DP Masuk',
                'Batal': 'Batal / Unqualified',
                'Unqualified': 'Batal / Unqualified',
                'Batal / Unqualified': 'Batal / Unqualified'
            },

            _mapLeadStatus: (s) => {
                return MigrationService._LEAD_STATUS_MAP[s] || 'Prospek / Survey';
            },

            getTombstones: (type, userId) => {
                const key = type === 'leads' ? MigrationService.BASE_KEYS.TOMBSTONE_LEADS : MigrationService.BASE_KEYS.TOMBSTONE_TASKS;
                const namespacedKey = StorageService.getUserKey(key, userId);
                return new Set(StorageService.getItem(namespacedKey, []));
            },

            addTombstone: (type, id, userId) => {
                if (!id) return;
                const key = type === 'leads' ? MigrationService.BASE_KEYS.TOMBSTONE_LEADS : MigrationService.BASE_KEYS.TOMBSTONE_TASKS;
                const namespacedKey = StorageService.getUserKey(key, userId);
                const list = StorageService.getItem(namespacedKey, []);
                if (!list.includes(String(id))) {
                    list.push(String(id));
                    StorageService.setItem(namespacedKey, list);
                }
            },

            migrateLeads: (rawLeads) => {
                if (!Array.isArray(rawLeads)) return [];
                return rawLeads.map(item => {
                    if (!item || typeof item !== 'object') return null;

                    // Idempoten: skema v2 yang sudah valid tidak dimutasi
                    if (item.schemaVersion === 2) {
                        return {
                            id: item.id || Utils.generateId('lead'),
                            schemaVersion: 2,
                            name: (item.name || '').trim().slice(0, 100),
                            phoneRaw: item.phoneRaw || item.phone || '',
                            phoneNormalized: item.phoneNormalized || PhoneUtils.normalize(item.phoneRaw || item.phone || ''),
                            project: (item.project || '').trim().slice(0, 200),
                            value: (typeof item.value === 'number' && !isNaN(item.value) && isFinite(item.value) && item.value >= 0)
                                ? item.value
                                : null,
                            status: MigrationService._mapLeadStatus(item.status),
                            // Pertahankan createdAt asli, TIDAK membuat tanggal historis buatan
                            createdAt: item.createdAt || null,
                            updatedAt: item.updatedAt || Utils.getAsiaJakartaIso(),
                            isLegacyFallbackCandidate: !!item.isLegacyFallbackCandidate || (item.value === 15000000),
                            syncStatus: item.syncStatus || 'synced'
                        };
                    }

                    // Migrasi dari skema lama
                    const phoneRaw = (item.phone === '081200000000' || item.phone === '0812-0000-0000') ? '' : (item.phone || '');
                    const phoneNormalized = PhoneUtils.normalize(phoneRaw);
                    const isLegacyDefaultVal = (item.value === 15000000);

                    let cleanValue = null;
                    if (typeof item.value === 'number' && !isNaN(item.value) && isFinite(item.value) && item.value >= 0) {
                        cleanValue = item.value;
                    }

                    return {
                        id: item.id ? String(item.id) : Utils.generateId('lead'),
                        schemaVersion: 2,
                        name: (item.name || 'Prospek Tanpa Nama').trim().slice(0, 100),
                        phoneRaw: phoneRaw,
                        phoneNormalized: phoneNormalized,
                        // Hapus default "Custom Interior" — biarkan kosong jika memang kosong
                        project: (item.project || '').trim().slice(0, 200),
                        value: cleanValue,
                        status: MigrationService._mapLeadStatus(item.status),
                        // Jika ada tanggal dari field 'date' lama, gunakan. Jika tidak ada, simpan null.
                        // TIDAK membuat createdAt dari Utils.getAsiaJakartaIso() untuk data historis.
                        createdAt: item.date ? (item.date + 'T00:00:00+07:00') : (item.createdAt || null),
                        updatedAt: Utils.getAsiaJakartaIso(),
                        isLegacyFallbackCandidate: isLegacyDefaultVal,
                        syncStatus: 'synced'
                    };
                }).filter(Boolean);
            },

            migrateTasks: (rawTasks) => {
                if (!Array.isArray(rawTasks)) return [];
                return rawTasks.map(item => {
                    if (!item || typeof item !== 'object') return null;

                    if (item.schemaVersion === 2) {
                        return {
                            id: item.id || Utils.generateId('task'),
                            schemaVersion: 2,
                            leadId: item.leadId || null,
                            client: (item.client || '').trim().slice(0, 100),
                            phoneRaw: item.phoneRaw || item.phone || '',
                            phoneNormalized: item.phoneNormalized || PhoneUtils.normalize(item.phoneRaw || item.phone || ''),
                            type: (item.type || 'Follow-Up Prospek').trim().slice(0, 100),
                            status: item.status || 'Pending',
                            dueDate: item.dueDate || null,
                            needsReschedule: !!item.needsReschedule,
                            createdAt: item.createdAt || null,
                            updatedAt: item.updatedAt || Utils.getAsiaJakartaIso(),
                            isDetachedFromDeletedLead: !!item.isDetachedFromDeletedLead,
                            syncStatus: item.syncStatus || 'synced'
                        };
                    }

                    const phoneRaw = (item.phone === '081200000000' || item.phone === '0812-0000-0000') ? '' : (item.phone || '');
                    const phoneNormalized = PhoneUtils.normalize(phoneRaw);
                    let dueDate = null;
                    let needsReschedule = false;

                    if (item.due && /^\d{4}-\d{2}-\d{2}$/.test(item.due)) {
                        dueDate = item.due;
                    } else if (item.dueDate && /^\d{4}-\d{2}-\d{2}$/.test(item.dueDate)) {
                        dueDate = item.dueDate;
                    } else if (item.due) {
                        // Jadwal lama berbentuk teks (mis. "Hari ini", "Minggu depan") -> tandai perlu dijadwal ulang
                        needsReschedule = true;
                    }

                    return {
                        id: item.id ? String(item.id) : Utils.generateId('task'),
                        schemaVersion: 2,
                        leadId: item.leadId || null,
                        client: (item.client || 'Klien Follow-up').trim().slice(0, 100),
                        phoneRaw: phoneRaw,
                        phoneNormalized: phoneNormalized,
                        type: (item.type || 'Follow-Up Prospek').trim().slice(0, 100),
                        status: item.status || 'Pending',
                        dueDate: dueDate,
                        needsReschedule: needsReschedule,
                        createdAt: null, // Tanggal pembuatan historis tidak diketahui
                        updatedAt: Utils.getAsiaJakartaIso(),
                        isDetachedFromDeletedLead: false,
                        syncStatus: 'synced'
                    };
                }).filter(Boolean);
            },

            loadUserData: (userId) => {
                const leadsKey = StorageService.getUserKey(MigrationService.BASE_KEYS.CRM_LEADS, userId);
                const tasksKey = StorageService.getUserKey(MigrationService.BASE_KEYS.FOLLOWUP_TASKS, userId);
                const tombLeads = MigrationService.getTombstones('leads', userId);
                const tombTasks = MigrationService.getTombstones('tasks', userId);

                let leads = [];
                let tasks = [];

                const rawLeads = localStorage.getItem(leadsKey);
                if (rawLeads !== null) {
                    try {
                        const parsed = JSON.parse(rawLeads);
                        // Backup sebelum migrasi (idempoten: hanya jika belum ada backup)
                        const backupKey = MigrationService.BASE_KEYS.PRE_MIGRATION_BACKUP + '_leads_' + (userId || 'local');
                        if (!localStorage.getItem(backupKey)) {
                            try { localStorage.setItem(backupKey, rawLeads); } catch (e) { /* ignore quota */ }
                        }
                        leads = MigrationService.migrateLeads(parsed);
                    } catch (e) {
                        // Data rusak — sudah diselamatkan oleh StorageService.getItem, jangan replace
                        const recoveryKey = leadsKey + '_corrupted_backup_' + Date.now();
                        try { localStorage.setItem(recoveryKey, rawLeads); } catch (e2) { /* ignore */ }
                        console.error('[MigrationService] Data leads rusak, disimpan ke:', recoveryKey);
                        leads = [];
                    }
                } else {
                    // Cek data lama (legacy key)
                    const legacyLeads = StorageService.getItem('nacira_crm_leads_2026', null);
                    if (legacyLeads) {
                        leads = MigrationService.migrateLeads(legacyLeads);
                        StorageService.setItem(MigrationService.BASE_KEYS.CRM_BACKUP_V1, legacyLeads);
                    }
                }

                const rawTasks = localStorage.getItem(tasksKey);
                if (rawTasks !== null) {
                    try {
                        const parsed = JSON.parse(rawTasks);
                        const backupKey = MigrationService.BASE_KEYS.PRE_MIGRATION_BACKUP + '_tasks_' + (userId || 'local');
                        if (!localStorage.getItem(backupKey)) {
                            try { localStorage.setItem(backupKey, rawTasks); } catch (e) { /* ignore quota */ }
                        }
                        tasks = MigrationService.migrateTasks(parsed);
                    } catch (e) {
                        const recoveryKey = tasksKey + '_corrupted_backup_' + Date.now();
                        try { localStorage.setItem(recoveryKey, rawTasks); } catch (e2) { /* ignore */ }
                        console.error('[MigrationService] Data tasks rusak, disimpan ke:', recoveryKey);
                        tasks = [];
                    }
                } else {
                    const legacyTasks = StorageService.getItem('nacira_followup_tasks_2026', null);
                    if (legacyTasks) {
                        tasks = MigrationService.migrateTasks(legacyTasks);
                        StorageService.setItem(MigrationService.BASE_KEYS.FOLLOWUP_BACKUP_V1, legacyTasks);
                    }
                }

                leads = leads.filter(l => !tombLeads.has(l.id));
                tasks = tasks.filter(t => !tombTasks.has(t.id));

                return { leads, tasks };
            },

            reconcileCloudData: (localItems, cloudItems, tombstones) => {
                const mergedMap = new Map();

                localItems.forEach(item => {
                    if (!tombstones.has(item.id)) {
                        mergedMap.set(item.id, item);
                    }
                });

                cloudItems.forEach(cloudItem => {
                    if (tombstones.has(cloudItem.id)) return;

                    if (!mergedMap.has(cloudItem.id)) {
                        mergedMap.set(cloudItem.id, cloudItem);
                    } else {
                        const localItem = mergedMap.get(cloudItem.id);
                        const localTime = new Date(localItem.updatedAt || 0).getTime();
                        const cloudTime = new Date(cloudItem.updatedAt || 0).getTime();

                        if (cloudTime > localTime) {
                            mergedMap.set(cloudItem.id, cloudItem);
                        }
                    }
                });

                return Array.from(mergedMap.values());

                if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                    try {
                        await navigator.clipboard.writeText(text);
                        return { success: true };
                    } catch (err) {
                        console.warn("[ClipboardUtils] navigator.clipboard gagal, mencoba DOM fallback:", err);
                    }
                }
                let textArea = null;
                try {
                    textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.setAttribute("readonly", "");
                    textArea.style.position = "fixed";
                    textArea.style.top = "-9999px";
                    textArea.style.left = "-9999px";
                    textArea.style.opacity = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    return successful ? { success: true } : { success: false, error: 'execCommand copy gagal' };
                } catch (domErr) {
                    return { success: false, error: domErr.message || 'Gagal menyalin teks' };

                        textArea.parentNode.removeChild(textArea);

                    parts.push({ text: `Pesan klien:\n"${inputText.trim()}"` });
                } else {
                    parts.push({ text: "Analisis screenshot percakapan WhatsApp yang diunggah." });

                if (imagePart) parts.push(imagePart);

                const payload = {
                    contents: [{ role: 'user', parts: parts }],
                    systemInstruction: { parts: [{ text: AIService.buildSystemPrompt() }] },

                if (apiKey) {

        const CloudSettingsModal = ({ isOpen, onClose, onSaveConfig, currentConfig, syncStatus, onForceLocalMode }) => {
            const [jsonInput, setJsonInput] = useState('');
            const [err, setErr] = useState(null);
            const currentHostname = typeof window !== 'undefined' ? window.location.hostname : 'localhost';

            useEffect(() => {
                if (isOpen) {
                    if (currentConfig) {
                        setJsonInput(JSON.stringify(currentConfig, null, 2));
                    } else {
                        setJsonInput('');
                    }
                    setErr(null);
                }
            }, [isOpen, currentConfig]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isOpen) onClose();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);

            const handleSave = () => {
                if (!jsonInput.trim()) {
                    onSaveConfig(null);
                    onClose();
                    return;

                try {
                    const parsed = JSON.parse(jsonInput);
                    if (!parsed.apiKey || !parsed.projectId) {
                        setErr("Objek konfigurasi Firebase harus memiliki properti 'apiKey' dan 'projectId'.");
                        return;

                    onSaveConfig(parsed);
                    onClose();

                    setErr("Format JSON tidak valid: " + e.message);

        // =========================================================================
        // 8. FEATURE MODULE 1: AI WORKSPACE
        // =========================================================================
        const AIWorkspace = ({ showToast }) => {
            const [inputText, setInputText] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState(null);
            const [copySuccess, setCopySuccess] = useState(false);
            const [aiError, setAiError] = useState(null);
            
            const [customApiKey, setCustomApiKey] = useState(() => {
                const storedKey = sessionStorage.getItem('nacira_session_gemini_key') || StorageService.getItem('nacira_gemini_api_key', '');
                return storedKey || DEFAULT_GEMINI_API_KEY;
            });
            const [keyStorageMode, setKeyStorageMode] = useState(() => {
                if (sessionStorage.getItem('nacira_session_gemini_key')) return 'session';
                return 'local';
            });
            const [selectedModel, setSelectedModel] = useState(() => {
                const saved = StorageService.getItem('nacira_gemini_model', '');
                if (!saved || saved === 'gemini-1.5-flash' || saved === 'gemini-2.5-flash') {
                    return DEFAULT_GEMINI_MODEL;
                }
                return saved;
            });
            const [customProxyUrl, setCustomProxyUrl] = useState(() => StorageService.getItem('nacira_custom_proxy_url', ''));
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);

            const fileInputRef = useRef(null);
            const abortControllerRef = useRef(null);

            useEffect(() => {
                return () => {
                    if (abortControllerRef.current) abortControllerRef.current.abort();
                };
            }, []);

            const handleSaveKeySettings = (keyVal, mode, modelVal, proxyVal) => {
                const cleanKey = keyVal.trim();
                const keyToUse = cleanKey || DEFAULT_GEMINI_API_KEY;
                setCustomApiKey(keyToUse);
                setKeyStorageMode(mode);
                setSelectedModel(modelVal);
                setCustomProxyUrl(proxyVal.trim());

                if (mode === 'session') {
                    sessionStorage.setItem('nacira_session_gemini_key', cleanKey);
                    StorageService.removeItem('nacira_gemini_api_key');
                } else {
                    StorageService.setItem('nacira_gemini_api_key', cleanKey);
                    sessionStorage.removeItem('nacira_session_gemini_key');
                }

                StorageService.setItem('nacira_gemini_model', modelVal);
                StorageService.setItem('nacira_custom_proxy_url', proxyVal.trim());
                setShowApiKeyModal(false);
                showToast("Pengaturan AI & API Key berhasil diperbarui!");
            };

            const processImageFile = (file) => {
                if (!file.type.startsWith('image/')) {
                    setAiError("Format file harus berupa gambar (PNG, JPG, WEBP).");
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    setAiError("Ukuran gambar terlalu besar. Maksimal 5MB.");
                    return;
                }
                setAiError(null);
                setSelectedImage(file);
                const reader = new FileReader();
                reader.onload = () => {
                    setImagePreview(reader.result);
                    showToast("Screenshot WhatsApp berhasil dimuat!");
                };
                reader.onerror = () => {
                    setAiError("Gagal membaca file gambar. Silakan pilih kembali.");
                    removeImage();
                };
                reader.onabort = () => {
                    setAiError("Pembacaan file gambar dibatalkan.");
                };
                reader.readAsDataURL(file);
            };

            const handleImageUpload = (e) => {
                if (e.target.files && e.target.files[0]) {
                    processImageFile(e.target.files[0]);
                }
            };

            useEffect(() => {
                const handlePaste = (e) => {
                    const items = e.clipboardData?.items;
                    if (!items) return;

                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            const file = items[i].getAsFile();
                            if (file) {
                                processImageFile(file);
                                e.preventDefault();
                                break;
                            }
                        }
                    }
                };

                window.addEventListener('paste', handlePaste);
                return () => window.removeEventListener('paste', handlePaste);
            }, []);

            const removeImage = () => {
                setSelectedImage(null);
                setImagePreview(null);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const generateReply = async () => {
                if (!inputText.trim() && !selectedImage) {
                    setAiError("Mohon masukkan teks chat atau unggah/paste screenshot percakapan WhatsApp.");
                    return;
                }

                const activeKey = customApiKey.trim();
                const proxyUrl = customProxyUrl.trim();

                if (!activeKey && !proxyUrl) {
                    setAiError("API Key Gemini atau Custom Proxy URL belum diatur. Klik 'Atur API Key' di atas.");
                    setShowApiKeyModal(true);
                    return;
                }

                if (isLoading) return;

                setIsLoading(true);
                setAiError(null);
                setAiResponse(null);

                if (abortControllerRef.current) {
                    abortControllerRef.current.abort();
                }
                abortControllerRef.current = new AbortController();

                try {
                    const result = await AIService.generateWhatsAppReply({
                        inputText: inputText.trim(),
                        selectedImage,
                        imagePreview,
                        apiKey: activeKey,
                        model: selectedModel,
                        proxyUrl: proxyUrl,
                        signal: abortControllerRef.current.signal
                    });
                    setAiResponse(result);
                } catch (error) {
                    if (error.name === 'AbortError') return;
                    console.error("[AI Workspace] Error:", error);
                    setAiError(error.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleCopy = async () => {
                if (!aiResponse?.reply) return;
                const res = await ClipboardUtils.copyText(aiResponse.reply);
                if (res.success) {
                    setCopySuccess(true);
                    showToast("Balasan WhatsApp berhasil disalin!");
                    setTimeout(() => setCopySuccess(false), 2000);
                } else {
                    setAiError("Gagal menyalin teks secara otomatis: " + res.error);
                }
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 pb-12 animate-fade-in">
                    <div className="lg:col-span-6 space-y-6">
                        <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-[#26262d]">
                            <div className="flex items-center justify-between mb-6">
                                <h2 className="serif-font text-lg font-bold text-white flex items-center gap-2">
                                    <div className="p-2 bg-[#202028] text-[#c5a059] rounded-xl">
                                        <Icons.MessageSquare />
                                    </div>
                                    WhatsApp Lead & Chat Input
                                </h2>
                                <button 
                                    onClick={() => setShowApiKeyModal(true)}
                                    className="text-xs font-semibold px-3 py-1.5 bg-[#202028] hover:bg-[#282832] text-[#c5a059] rounded-full border border-[#33333d] flex items-center gap-1.5 transition-colors shadow-sm"
                                    title={`Model: ${selectedModel} | API Key Aktif`}
                                >
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    <Icons.Key /> {customApiKey ? `Gemini Aktif (${selectedModel})` : 'Atur API Key'}
                                </button>
                            </div>

                            {aiError && (
                                <div className="mb-4 p-3.5 bg-rose-950/80 border border-rose-800 text-rose-200 rounded-xl text-xs font-semibold flex items-center gap-2" role="alert">
                                    <span>⚠️</span> {aiError}
                                </div>
                            )}

                            <div className="space-y-5">
                                <FormField label="Pesan / Pertanyaan Klien" helperText="Opsional jika melampirkan screenshot chat">
                                    <textarea 
                                        className="w-full bg-[#15151a] border border-[#26262d] rounded-2xl p-4 text-sm focus:ring-2 focus:ring-[#c5a059]/30 focus:border-[#c5a059] transition-all resize-none shadow-inner text-zinc-100 placeholder:text-zinc-600"
                                        rows="4"
                                        placeholder="Contoh: 'Min, mau tanya bikin kitchen set multipleks minimalis 3 meter di Bandung berapa ya? Apakah sudah termasuk survey dan desain 3D?'"
                                        value={inputText}
                                        onChange={(e) => setInputText(e.target.value)}
                                    ></textarea>
                                </FormField>

                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="text-xs font-bold uppercase tracking-wider text-zinc-400">Screenshot Chat WhatsApp</label>
                                        <span className="text-[11px] font-semibold text-[#c5a059] bg-[#202028] px-2.5 py-0.5 rounded-md">💡 Klik atau Tekan Ctrl + V</span>
                                    </div>
                                    
                                    {!imagePreview ? (
                                        <div 
                                            className="border-2 border-dashed border-[#33333d] rounded-2xl p-8 text-center hover:bg-[#1a1a22]/60 hover:border-[#c5a059] transition-all cursor-pointer group bg-[#15151a]/50"
                                            onClick={() => fileInputRef.current?.click()}
                                            onDragOver={(e) => e.preventDefault()}
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                                                    processImageFile(e.dataTransfer.files[0]);
                                                }
                                            }}
                                        >
                                            <div className="mx-auto w-14 h-14 bg-[#202028] rounded-2xl flex items-center justify-center text-[#c5a059] group-hover:scale-110 transition-transform mb-3 shadow-md">
                                                <Icons.Image />
                                            </div>
                                            <p className="text-sm font-semibold text-zinc-200">Klik untuk unggah atau <span className="text-[#c5a059] underline underline-offset-2">Paste (Ctrl+V)</span></p>
                                            <p className="text-xs text-zinc-500 mt-1">PNG, JPG, WEBP (Maksimal 5MB)</p>
                                            <input 
                                                type="file" 
                                                ref={fileInputRef} 
                                                onChange={handleImageUpload} 
                                                accept="image/png, image/jpeg, image/webp" 
                                                className="hidden" 
                                            />
                                        </div>
                                    ) : (
                                        <div className="relative rounded-2xl border border-[#33333d] overflow-hidden bg-black group shadow-lg">
                                            <img src={imagePreview} alt="Preview Screenshot" className="w-full h-52 object-cover object-top opacity-90 group-hover:opacity-100 transition-opacity" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end justify-between p-4">
                                                <span className="text-xs font-medium text-white bg-black/70 px-2.5 py-1 rounded-lg backdrop-blur-md">Screenshot Terlampir</span>
                                                <button 
                                                    onClick={removeImage}
                                                    className="bg-black/80 hover:bg-black text-rose-400 p-2 rounded-xl shadow-lg transition-transform hover:scale-105"
                                                    aria-label="Hapus screenshot yang terlampir"
                                                >
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="pt-2">
                                    <button 
                                        onClick={generateReply}
                                        disabled={isLoading}
                                        className={`w-full flex items-center justify-center gap-2.5 py-4 px-6 rounded-2xl font-bold shadow-xl transition-all ${
                                            isLoading ? 'bg-[#2a2a30] text-zinc-500 cursor-not-allowed' : 'gold-btn shadow-[#c5a059]/25'
                                        }`}
                                    >
                                        {isLoading ? (
                                            <React.Fragment>
                                                <svg className="animate-spin h-5 w-5 text-[#c5a059]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Meracik Balasan Strategis...
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <Icons.Zap /> Generate Balasan WhatsApp AI ({selectedModel})
                                            </React.Fragment>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="lg:col-span-6">
                        {isLoading ? (
                            <div className="glass-panel rounded-3xl p-8 shadow-2xl h-full flex flex-col justify-center items-center text-zinc-500 border border-[#26262d] min-h-[450px]">
                                <div className="relative w-20 h-20 mb-6">
                                    <div className="absolute inset-0 bg-[#c5a059]/20 rounded-full animate-ping"></div>
                                    <div className="relative bg-[#18181e] rounded-2xl p-5 shadow-2xl border border-[#c5a059]/30 text-[#c5a059] flex items-center justify-center">
                                        <Icons.Brain />
                                    </div>
                                </div>
                                <h3 className="serif-font text-lg font-bold text-white">Nacira AI Sedang Bekerja...</h3>
                                <p className="text-sm mt-2 text-center max-w-sm text-zinc-400">Menganalisis master pricelist kitchen, wardrobe & living room.</p>
                            </div>
                        ) : aiResponse ? (
                            <div className="bg-[#15151a] rounded-3xl shadow-2xl border border-[#26262d] overflow-hidden flex flex-col h-full animate-fade-in">
                                <div className="bg-[#1b1b22] text-white px-6 py-5 flex justify-between items-center flex-wrap gap-3 border-b border-[#26262d]">
                                    <div className="flex items-center gap-2.5 font-bold text-sm">
                                        <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                                        Balasan WhatsApp Siap Dikirim
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {aiResponse.principlesUsed?.map((p, i) => (
                                            <span key={i} className="px-2.5 py-1 rounded-lg bg-[#26262d] text-[#c5a059] text-xs font-bold uppercase tracking-wider border border-[#383842]">
                                                {p}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="p-6 md:p-8 flex-1 flex flex-col justify-between space-y-6">
                                    <div>
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-xs font-bold text-zinc-500 uppercase tracking-wider">Draf Teks WhatsApp</h3>
                                            <button 
                                                onClick={handleCopy}
                                                className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm ${
                                                    copySuccess ? 'bg-emerald-500 text-white' : 'bg-[#202028] hover:bg-[#c5a059] hover:text-[#0d0d0d] text-zinc-300 border border-[#2e2e38]'
                                                }`}
                                            >
                                                {copySuccess ? <React.Fragment><Icons.CheckCircle /> Disalin!</React.Fragment> : <React.Fragment><Icons.Copy /> Copy Teks</React.Fragment>}
                                            </button>
                                        </div>
                                        <div className="bg-[#1b1b22] border border-[#26262d] rounded-2xl p-5">
                                            <p className="text-zinc-200 text-sm md:text-base leading-relaxed whitespace-pre-wrap font-medium">
                                                {aiResponse.reply}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-[#26262d]">
                                        <h3 className="text-xs font-bold text-zinc-500 uppercase tracking-wider mb-2.5 flex items-center gap-2">
                                            <Icons.Brain /> Analisis Strategi Penjualan
                                        </h3>
                                        <div className="bg-[#1b1b22] rounded-2xl p-4 text-xs md:text-sm text-zinc-400 leading-relaxed border border-[#26262d] font-medium">
                                            {aiResponse.explanation}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="glass-panel rounded-3xl p-8 shadow-2xl h-full flex flex-col justify-center items-center text-zinc-500 border border-[#26262d] min-h-[450px] border-dashed text-center">
                                <div className="w-16 h-16 bg-[#1a1a20] rounded-2xl flex items-center justify-center text-zinc-400 mb-4 shadow-inner">
                                    <Icons.Send />
                                </div>
                                <h3 className="serif-font font-bold text-white text-base">Belum Ada Balasan Dibuat</h3>
                                <p className="text-sm mt-1 text-zinc-400 max-w-sm">
                                    Masukkan chat atau screenshot pelanggan di sebelah kiri, lalu klik Generate untuk membuat balasan AI resmi.
                                </p>
                            </div>
                        )}
                    </div>

                    <ApiKeyModal 
                        isOpen={showApiKeyModal}
                        onClose={() => setShowApiKeyModal(false)}
                        onSave={handleSaveKeySettings}
                        currentKey={customApiKey}
                        keyStorageMode={keyStorageMode}
                        selectedModel={selectedModel}
                        customProxyUrl={customProxyUrl}
                    />
                </div>
            );
        };

        // =========================================================================
        // 9. FEATURE MODULE 2: CRM MODULE
        // =========================================================================
        const CRMModule = ({ crmLeads, setCrmLeads, followUpTasks, setFollowUpTasks, userId, showToast }) => {
            const [crmSearch, setCrmSearch] = useState('');
            const [crmStatusFilter, setCrmStatusFilter] = useState('Semua');
            const [crmSortOption, setCrmSortOption] = useState('terbaru');

            const [newLeadName, setNewLeadName] = useState('');
            const [newLeadPhone, setNewLeadPhone] = useState('');
            const [newLeadProject, setNewLeadProject] = useState('');
            const [newLeadValue, setNewLeadValue] = useState('');
            const [newLeadStatus, setNewLeadStatus] = useState('Prospek / Survey');

            const [crmError, setCrmError] = useState(null);
            const [duplicateWarning, setDuplicateWarning] = useState(null);
            const [isAddingLead, setIsAddingLead] = useState(false);
            const [deleteTargetId, setDeleteTargetId] = useState(null);
            const [isDeletingLead, setIsDeletingLead] = useState(false);
            const [editingLead, setEditingLead] = useState(null);

            useEffect(() => {
                const norm = PhoneUtils.normalize(newLeadPhone);
                if (norm && norm.length >= 8) {
                    const match = crmLeads.find(l => l.phoneNormalized === norm);
                    if (match) {
                        setDuplicateWarning(`Perhatian: Nomor WhatsApp ini sudah terdaftar atas nama klien "${match.name}".`);
                    } else {
                        setDuplicateWarning(null);
                    }
                } else {
                    setDuplicateWarning(null);
                }
            }, [newLeadPhone, crmLeads]);

            const handleAddLead = async () => {
                const trimmedName = newLeadName.trim().slice(0, 100);
                if (!trimmedName) {
                    setCrmError("Mohon masukkan nama klien.");
                    return;
                }

                let cleanVal = null;
                if (newLeadValue.trim() !== '') {
                    const num = Number(newLeadValue);
                    if (isNaN(num) || !isFinite(num) || num < 0) {
                        setCrmError("Nilai proyek tidak boleh negatif atau berupa karakter tidak valid.");
                        return;
                    }
                    cleanVal = num;
                }

                setCrmError(null);
                setIsAddingLead(true);

                const phoneRaw = newLeadPhone.trim().slice(0, 30);
                const phoneNormalized = PhoneUtils.normalize(phoneRaw);
                const docId = Utils.generateId('lead');

                const leadData = {
                    id: docId,
                    schemaVersion: 2,
                    name: trimmedName,
                    phoneRaw: phoneRaw,
                    phoneNormalized: phoneNormalized,
                    project: newLeadProject.trim().slice(0, 200),
                    value: cleanVal,
                    status: newLeadStatus,
                    createdAt: Utils.getAsiaJakartaIso(),
                    updatedAt: Utils.getAsiaJakartaIso(),
                    isLegacyFallbackCandidate: false,
                    syncStatus: 'synced'
                };

                setCrmLeads(prev => [leadData, ...prev]);

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, setDoc } = window.firebaseServices;
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'crmLeads', docId), leadData);
                        showToast("Prospek berhasil disimpan & tersinkronisasi ke Cloud!");
                    } catch (e) {
                        console.warn("[CRM] Cloud write failed:", e);
                        setCrmLeads(prev => prev.map(l => l.id === docId ? { ...l, syncStatus: 'pending' } : l));
                        showToast("Tersimpan di lokal. (Cloud sync gagal: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Prospek berhasil disimpan di penyimpanan lokal.");
                }

                setNewLeadName('');
                setNewLeadPhone('');
                setNewLeadProject('');
                setNewLeadValue('');
                setDuplicateWarning(null);
                setIsAddingLead(false);
            };

            const handleUpdateLead = async (updatedLead) => {
                setCrmLeads(prev => prev.map(l => l.id === updatedLead.id ? updatedLead : l));
                setEditingLead(null);

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, setDoc } = window.firebaseServices;
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'crmLeads', updatedLead.id), updatedLead);
                        showToast("Data prospek berhasil diperbarui di Cloud!");
                    } catch (e) {
                        console.warn("[CRM] Cloud update failed:", e);
                        showToast("Data diperbarui di lokal. (Cloud update gagal: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Data prospek berhasil diperbarui secara lokal!");
                }
            };

            const confirmDeleteLead = async () => {
                if (!deleteTargetId) return;
                const leadId = deleteTargetId;
                setIsDeletingLead(true);

                // Putuskan tautan tugas follow-up yang terhubung ke lead ini (TIDAK menghapus tugas!)
                setFollowUpTasks(prev => prev.map(t => {
                    if (t.leadId === leadId) {
                        return { ...t, leadId: null, isDetachedFromDeletedLead: true, updatedAt: Utils.getAsiaJakartaIso() };
                    }
                    return t;
                }));

                MigrationService.addTombstone('leads', leadId, userId);
                setCrmLeads(prev => prev.filter(l => l.id !== String(leadId)));

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, deleteDoc } = window.firebaseServices;
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'crmLeads', String(leadId)));
                        showToast("Data klien dihapus. Tugas terkait dipertahankan.");
                    } catch (e) {
                        console.warn("[CRM] Cloud delete failed:", e);
                        showToast("Dihapus lokal. (Cloud delete tertunda: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Data klien dihapus. Tugas follow-up terkait dilepas (standalone).");
                }

                setIsDeletingLead(false);
                setDeleteTargetId(null);
            };

            const filteredLeads = useMemo(() => {
                return crmLeads.filter(l => {
                    const searchLower = crmSearch.toLowerCase();
                    const matchesSearch = 
                        (l.name || '').toLowerCase().includes(searchLower) || 
                        (l.project || '').toLowerCase().includes(searchLower) ||
                        (l.status || '').toLowerCase().includes(searchLower) ||
                        (l.phoneRaw || '').toLowerCase().includes(searchLower) ||
                        (l.phoneNormalized || '').toLowerCase().includes(searchLower);

                    const matchesStatus = crmStatusFilter === 'Semua' || l.status === crmStatusFilter;
                    return matchesSearch && matchesStatus;
                }).sort((a, b) => {
                    if (crmSortOption === 'terbaru') return (b.createdAt || '').localeCompare(a.createdAt || '');
                    if (crmSortOption === 'terlama') return (a.createdAt || '').localeCompare(b.createdAt || '');
                    if (crmSortOption === 'nilai_tinggi') return (b.value || 0) - (a.value || 0);
                    if (crmSortOption === 'nilai_rendah') return (a.value || 0) - (b.value || 0);
                    if (crmSortOption === 'nama_az') return (a.name || '').localeCompare(b.name || '', 'id', { sensitivity: 'base' });
                    return 0;
                });
            }, [crmLeads, crmSearch, crmStatusFilter, crmSortOption]);

            const totalLeadsCount = crmLeads.length;
            const activeLeads = useMemo(() => crmLeads.filter(l => l.status === 'Prospek / Survey' || l.status === 'Design Review'), [crmLeads]);
            const activePipelineValue = useMemo(() => activeLeads.reduce((acc, curr) => acc + (typeof curr.value === 'number' ? curr.value : 0), 0), [activeLeads]);
            const closingLeads = useMemo(() => crmLeads.filter(l => l.status === 'Closing / DP Masuk'), [crmLeads]);
            const closingRevenueValue = useMemo(() => closingLeads.reduce((acc, curr) => acc + (typeof curr.value === 'number' ? curr.value : 0), 0), [closingLeads]);
            const closingCount = closingLeads.length;

            return (
                <div className="space-y-6 pb-12 animate-fade-in">
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        <div className="glass-panel rounded-3xl p-6 shadow-2xl border border-[#26262d] flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-[#202028] text-[#c5a059] flex items-center justify-center font-bold text-lg">
                                <Icons.Users />
                            </div>
                            <div>
                                <p className="text-xs font-bold uppercase tracking-wider text-zinc-500">Total Prospek</p>
                                <h3 className="serif-font text-2xl font-extrabold text-white mt-0.5">{totalLeadsCount} Klien</h3>
                            </div>
                        </div>
                        <div className="glass-panel rounded-3xl p-6 shadow-2xl border border-[#26262d] flex items-center gap-4">
                            <div className="w-12 h-12 rounded-2xl bg-[#202028] text-amber-400 flex items-center justify-center font-bold text-lg">
                                Rp
                            </div>
                            <div>
                                <p className="text-xs font-bold uppercase tracking-wider text-zinc-500">Active Pipeline (Aktif)</p>
                                <h3 className="serif-font text-xl font-extrabold text-white mt-0.5">Rp {activePipelineValue.toLocaleString('id-ID')}</h3>
                            </div>
                        </div>
                        <div className="glass-panel rounded-3xl p-6 shadow-2xl border border-[#26262d] flex items-center gap-4 sm:col-span-2 md:col-span-1">
                            <div className="w-12 h-12 rounded-2xl bg-[#202028] text-emerald-400 flex items-center justify-center font-bold text-lg">
                                <Icons.CheckCircle />
                            </div>
                            <div>
                                <p className="text-xs font-bold uppercase tracking-wider text-zinc-500">Closing Revenue ({closingCount} Deal)</p>
                                <h3 className="serif-font text-xl font-extrabold text-emerald-400 mt-0.5">Rp {closingRevenueValue.toLocaleString('id-ID')}</h3>
                            </div>
                        </div>
                    </div>

                    <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-[#26262d] space-y-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h2 className="serif-font text-xl font-extrabold text-white">Tambah Prospek CRM Baru</h2>
                                <p className="text-sm text-zinc-400 mt-1">Input data klien interior tanpa angka default fiktif.</p>
                            </div>
                            <button 
                                onClick={() => {
                                    const res = ExportService.exportToCSV('crm', crmLeads);
                                    if (res.success) showToast("File CSV CRM berhasil diekspor dengan proteksi formula!");
                                    else setCrmError("Gagal mengunduh file CSV: " + res.error);
                                }}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/25 transition-all w-full md:w-auto justify-center"
                            >
                                <Icons.FileSpreadsheet /> Export CSV CRM
                            </button>
                        </div>

                        {crmError && (
                            <div className="p-3 bg-rose-950/80 border border-rose-800 text-rose-200 rounded-xl text-xs font-semibold" role="alert">
                                ⚠️ {crmError}
                            </div>
                        )}

                        {duplicateWarning && (
                            <div className="p-3 bg-amber-950/80 border border-amber-800 text-amber-200 rounded-xl text-xs font-semibold flex items-center gap-2" role="alert">
                                <span>⚠️</span> {duplicateWarning}
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-3 pt-4 border-t border-[#26262d]">
                            <input 
                                type="text" 
                                placeholder="Nama Klien..." 
                                value={newLeadName}
                                onChange={(e) => setNewLeadName(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#c5a059]/30 text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <input 
                                type="text" 
                                placeholder="No WA (08... / +62...)" 
                                value={newLeadPhone}
                                onChange={(e) => setNewLeadPhone(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#c5a059]/30 text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <input 
                                type="text" 
                                placeholder="Detail Proyek Interior" 
                                value={newLeadProject}
                                onChange={(e) => setNewLeadProject(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#c5a059]/30 text-white shadow-inner placeholder:text-zinc-600 sm:col-span-2 md:col-span-2"
                            />
                            <input 
                                type="number" 
                                placeholder="Nilai Rp (Kosong = N/A)" 
                                value={newLeadValue}
                                onChange={(e) => setNewLeadValue(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#c5a059]/30 text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <select
                                value={newLeadStatus}
                                onChange={(e) => setNewLeadStatus(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-[#c5a059]/30 text-zinc-200 shadow-inner sm:col-span-1 md:col-span-1"
                            >
                                <option value="Prospek / Survey">Prospek / Survey</option>
                                <option value="Design Review">Design Review</option>
                                <option value="Closing / DP Masuk">Closing / DP Masuk</option>
                                <option value="Batal / Unqualified">Batal / Unqualified</option>
                            </select>
                        </div>
                        <div className="flex justify-end">
                            <button 
                                onClick={handleAddLead}
                                disabled={isAddingLead}
                                className="gold-btn px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-[#c5a059]/25"
                            >
                                {isAddingLead ? (
                                    <span>Menyimpan...</span>
                                ) : (
                                    <React.Fragment><Icons.Plus /> Simpan Prospek</React.Fragment>
                                )}
                            </button>
                        </div>
                    </div>

                    <div className="bg-[#15151a] rounded-3xl shadow-2xl border border-[#26262d] overflow-hidden">
                        <div className="p-4 md:p-6 border-b border-[#26262d] flex items-center justify-between gap-4 flex-wrap">
                            <div className="relative flex-1 max-w-md">
                                <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                                    <Icons.Search />
                                </span>
                                <input 
                                    type="text"
                                    placeholder="Cari nama, nomor WA, proyek, atau status..."
                                    value={crmSearch}
                                    onChange={(e) => setCrmSearch(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2.5 bg-[#1b1b22] border border-[#26262d] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#c5a059]/30 font-medium text-white placeholder:text-zinc-600"
                                />
                            </div>

                            <div className="flex items-center gap-3 flex-wrap">
                                <select 
                                    value={crmStatusFilter}
                                    onChange={(e) => setCrmStatusFilter(e.target.value)}
                                    className="bg-[#1b1b22] border border-[#26262d] rounded-xl px-3 py-2 text-xs font-bold text-zinc-300"
                                >
                                    <option value="Semua">Semua Status</option>
                                    <option value="Prospek / Survey">Prospek / Survey</option>
                                    <option value="Design Review">Design Review</option>
                                    <option value="Closing / DP Masuk">Closing / DP Masuk</option>
                                    <option value="Batal / Unqualified">Batal / Unqualified</option>
                                </select>

                                <select 
                                    value={crmSortOption}
                                    onChange={(e) => setCrmSortOption(e.target.value)}
                                    className="bg-[#1b1b22] border border-[#26262d] rounded-xl px-3 py-2 text-xs font-bold text-zinc-300"
                                >
                                    <option value="terbaru">Urutkan: Terbaru</option>
                                    <option value="terlama">Urutkan: Terlama</option>
                                    <option value="nilai_tinggi">Nilai: Tertinggi</option>
                                    <option value="nilai_rendah">Nilai: Terendah</option>
                                    <option value="nama_az">Nama A-Z</option>
                                </select>

                                <span className="text-xs font-bold text-zinc-500">
                                    {filteredLeads.length} dari {crmLeads.length} data
                                </span>
                            </div>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[640px]">
                                <thead>
                                    <tr className="bg-[#1b1b22] border-b border-[#26262d] text-xs uppercase text-zinc-400 font-bold tracking-wider">
                                        <th className="py-4 px-6">Nama Klien</th>
                                        <th className="py-4 px-6">Kontak WA</th>
                                        <th className="py-4 px-6">Detail Proyek</th>
                                        <th className="py-4 px-6">Estimasi Nilai</th>
                                        <th className="py-4 px-6">Status</th>
                                        <th className="py-4 px-6">Tgl Masuk</th>
                                        <th className="py-4 px-6 text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-[#202028] text-sm">
                                    {crmLeads.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="py-12 text-center text-zinc-500 font-medium">
                                                Belum ada data prospek. Tambahkan prospek baru melalui form di atas.
                                            </td>
                                        </tr>
                                    ) : filteredLeads.length === 0 ? (
                                        <tr>
                                            <td colSpan="6" className="py-12 text-center text-zinc-500 font-medium">
                                                Tidak ada data prospek yang sesuai dengan pencarian atau filter Anda.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredLeads.map((lead) => {
                                            const displayPhone = PhoneUtils.formatDisplay(lead.phoneRaw, lead.phoneNormalized);
                                            const hasValidWa = !!lead.phoneNormalized;

                                            return (
                                                <tr key={lead.id} className="hover:bg-[#1b1b22]/60 transition-colors">
                                                    <td className="py-4 px-6">
                                                        <div className="font-bold text-white flex items-center gap-2">
                                                            {lead.name}
                                                            {lead.isLegacyFallbackCandidate && (
                                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-800" title="Data bawaan skema awal">
                                                                    ⚠️ Perlu Verifikasi
                                                                </span>
                                                            )}
                                                            {lead.syncStatus === 'pending' && (
                                                                <span className="w-2 h-2 rounded-full bg-amber-400" title="Belum sinkron ke cloud"></span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-6 text-zinc-300 font-medium">
                                                        {hasValidWa ? (
                                                            <a href={PhoneUtils.buildWaLink(lead.phoneNormalized)} target="_blank" rel="noreferrer" className="text-[#c5a059] hover:underline font-semibold flex items-center gap-1">
                                                                {displayPhone}
                                                            </a>
                                                        ) : (
                                                            <span className="text-zinc-500 italic">{displayPhone}</span>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-6 text-zinc-300 font-medium">{lead.project}</td>
                                                    <td className="py-4 px-6 text-white font-bold">
                                                        {lead.value === null ? (
                                                            <span className="text-zinc-500 font-normal italic">Belum Diisi</span>
                                                        ) : (
                                                            `Rp ${Number(lead.value).toLocaleString('id-ID')}`
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-6">
                                                        <StatusBadge status={lead.status} />
                                                    </td>
                                                    <td className="py-4 px-6 text-zinc-500 text-xs font-medium">
                                                        {lead.createdAt ? lead.createdAt.slice(0, 10) : <span className="italic text-zinc-600">Tidak tercatat</span>}
                                                    </td>
                                                    <td className="py-4 px-6 text-right">
                                                        <div className="flex items-center justify-end gap-2">
                                                            <button
