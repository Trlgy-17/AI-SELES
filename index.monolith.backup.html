                                                                onClick={() => setEditingLead(lead)}
                                                                className="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-[#202028] transition-colors"
                                                                aria-label={`Edit prospek klien ${lead.name}`}
                                                            >
                                                                <Icons.Edit />
                                                            </button>
                                                            <button 
                                                                onClick={() => setDeleteTargetId(lead.id)}
                                                                className="text-zinc-500 hover:text-rose-400 p-2 rounded-xl hover:bg-rose-950/40 transition-colors"
                                                                aria-label={`Hapus prospek klien ${lead.name}`}
                                                            >
                                                                <Icons.Trash />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <EditLeadModal 
                        isOpen={!!editingLead}
                        allLeads={crmLeads}
                        lead={editingLead}
                        onSave={handleUpdateLead}
                        onCancel={() => setEditingLead(null)}
                    />

                    <ConfirmModal 
                        isOpen={!!deleteTargetId}
                        title="Hapus Data Prospek"
                        message={(() => { const linkedCount = followUpTasks ? followUpTasks.filter(t => t.leadId === deleteTargetId).length : 0; return 'Hapus data klien ini? ' + (linkedCount > 0 ? linkedCount + ' tugas follow-up akan dilepas (tidak dihapus) dan tetap bisa diakses di Follow-Up Flow.' : 'Data tidak dapat dikembalikan setelah dihapus.'); })()}
                        onConfirm={confirmDeleteLead}
                        onCancel={() => setDeleteTargetId(null)}
                        isLoading={isDeletingLead}
                    />
                </div>
            );
        };

        // =========================================================================
        // 10. FEATURE MODULE 3: FOLLOW-UP FLOW
        // =========================================================================
        const FollowUpModule = ({ followUpTasks, setFollowUpTasks, crmLeads, userId, showToast }) => {
            const [followUpSearch, setFollowUpSearch] = useState('');
            const [taskFilter, setTaskFilter] = useState('Semua');

            const [selectedLeadId, setSelectedLeadId] = useState('');
            const [newFollowClient, setNewFollowClient] = useState('');
            const [newFollowPhone, setNewFollowPhone] = useState('');
            const [newFollowType, setNewFollowType] = useState('');
            const [newFollowDue, setNewFollowDue] = useState('');

            const [followUpError, setFollowUpError] = useState(null);
            const [isAddingTask, setIsAddingTask] = useState(false);
            const [deleteTaskId, setDeleteTaskId] = useState(null);
            const [isDeletingTask, setIsDeletingTask] = useState(false);
            const [editingTask, setEditingTask] = useState(null);

            // Melacak tugas mana yang sedang dalam proses toggle status
            const [togglingTaskIds, setTogglingTaskIds] = useState(new Set());

            const handleLeadSelect = (e) => {
                const lId = e.target.value;
                setSelectedLeadId(lId);
                if (lId) {
                    const found = crmLeads.find(l => l.id === lId);
                    if (found) {
                        setNewFollowClient(found.name);
                        setNewFollowPhone(found.phoneRaw);
                    }
                }
            };

            const handleAddTask = async () => {
                const trimmedClient = newFollowClient.trim().slice(0, 100);
                if (!trimmedClient) {
                    setFollowUpError("Mohon masukkan nama klien untuk tugas follow-up.");
                    return;
                }
                setFollowUpError(null);
                setIsAddingTask(true);

                const phoneRaw = newFollowPhone.trim().slice(0, 30);
                const phoneNormalized = PhoneUtils.normalize(phoneRaw);
                const docId = Utils.generateId('task');

                const taskData = {
                    id: docId,
                    schemaVersion: 2,
                    leadId: selectedLeadId || null,
                    client: trimmedClient,
                    phoneRaw: phoneRaw,
                    phoneNormalized: phoneNormalized,
                    type: (newFollowType.trim() || 'Follow-Up Prospek').slice(0, 100),
                    status: 'Pending',
                    dueDate: newFollowDue || null,
                    createdAt: Utils.getAsiaJakartaIso(),
                    updatedAt: Utils.getAsiaJakartaIso(),
                    syncStatus: 'synced'
                };

                setFollowUpTasks(prev => [taskData, ...prev]);

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, setDoc } = window.firebaseServices;
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'followUpTasks', docId), taskData);
                        showToast("Jadwal follow-up berhasil disimpan & tersinkronisasi!");
                    } catch (e) {
                        console.warn("[FollowUp] Cloud write failed:", e);
                        setFollowUpTasks(prev => prev.map(t => t.id === docId ? { ...t, syncStatus: 'pending' } : t));
                        showToast("Tersimpan lokal. (Cloud sync gagal: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Jadwal follow-up berhasil disimpan di penyimpanan lokal.");
                }

                setSelectedLeadId('');
                setNewFollowClient('');
                setNewFollowPhone('');
                setNewFollowType('');
                setIsAddingTask(false);
            };

            const handleUpdateTask = async (updatedTask) => {
                setFollowUpTasks(prev => prev.map(t => t.id === updatedTask.id ? updatedTask : t));
                setEditingTask(null);

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, setDoc } = window.firebaseServices;
                        await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'followUpTasks', updatedTask.id), updatedTask);
                        showToast("Tugas follow-up diperbarui di Cloud!");
                    } catch (e) {
                        console.warn("[FollowUp] Cloud update failed:", e);
                        showToast("Diperbarui di lokal. (Cloud update gagal: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Tugas follow-up diperbarui!");
                }
            };

            const handleToggleTaskStatus = async (task) => {
                if (togglingTaskIds.has(task.id)) return; // Cegah klik beruntun / race condition

                setTogglingTaskIds(prev => new Set(prev).add(task.id));
                const newStatus = task.status === 'Selesai' ? 'Pending' : 'Selesai';
                const updated = { ...task, status: newStatus, updatedAt: Utils.getAsiaJakartaIso() };
                
                setFollowUpTasks(prev => prev.map(t => t.id === task.id ? updated : t));

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, updateDoc } = window.firebaseServices;
                        await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'followUpTasks', String(task.id)), {
                            status: newStatus,
                            updatedAt: updated.updatedAt
                        });
                    } catch (e) {
                        console.warn("[FollowUp] Cloud status update failed:", e);
                    }
                }

                setTogglingTaskIds(prev => {
                    const next = new Set(prev);
                    next.delete(task.id);
                    return next;
                });
                showToast(`Status tugas diubah menjadi ${newStatus}.`);
            };

            const confirmDeleteTask = async () => {
                if (!deleteTaskId) return;
                const taskId = deleteTaskId;
                setIsDeletingTask(true);

                MigrationService.addTombstone('tasks', taskId, userId);
                setFollowUpTasks(prev => prev.filter(t => t.id !== String(taskId)));

                if (window.firebaseServices?.db && userId) {
                    try {
                        const { db, appId, doc, deleteDoc } = window.firebaseServices;
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'followUpTasks', String(taskId)));
                        showToast("Tugas follow-up dihapus dari lokal & cloud.");
                    } catch (e) {
                        console.warn("[FollowUp] Cloud task delete failed:", e);
                        showToast("Dihapus lokal. (Cloud delete tertunda: " + e.message + ")", "warning");
                    }
                } else {
                    showToast("Tugas follow-up dihapus.");
                }

                setIsDeletingTask(false);
                setDeleteTaskId(null);
            };

            const todayStr = Utils.getAsiaJakartaDate();
            const rescheduleCount = useMemo(() => followUpTasks.filter(t => t.needsReschedule || (!t.dueDate && t.status !== 'Selesai')).length, [followUpTasks]);
            const completedCount = useMemo(() => followUpTasks.filter(t => t.status === 'Selesai').length, [followUpTasks]);
            const overdueCount = useMemo(() => followUpTasks.filter(t => t.status !== 'Selesai' && t.dueDate && t.dueDate < todayStr).length, [followUpTasks, todayStr]);
            const todayCount = useMemo(() => followUpTasks.filter(t => t.dueDate === todayStr && t.status !== 'Selesai').length, [followUpTasks, todayStr]);

            const filteredTasks = useMemo(() => {
                return followUpTasks.filter(t => {
                    const searchLower = followUpSearch.toLowerCase();
                    const matchesSearch = 
                        (t.client || '').toLowerCase().includes(searchLower) || 
                        (t.type || '').toLowerCase().includes(searchLower) ||
                        (t.status || '').toLowerCase().includes(searchLower) ||
                        (t.phoneRaw || '').toLowerCase().includes(searchLower);

                    if (!matchesSearch) return false;

                    if (taskFilter === 'Terlambat') {
                        return t.status !== 'Selesai' && t.dueDate && t.dueDate < todayStr;
                    }
                    if (taskFilter === 'Hari Ini') {
                        return t.dueDate === todayStr;
                    }
                    if (taskFilter === 'Mendatang') {
                        return t.dueDate && t.dueDate > todayStr;
                    }
                    if (taskFilter === 'Perlu Jadwal Ulang') {
                        return t.needsReschedule || (!t.dueDate && t.status !== 'Selesai');
                    }
                    if (taskFilter === 'Selesai') {
                        return t.status === 'Selesai';
                    }
                    return true;
                });
            }, [followUpTasks, followUpSearch, taskFilter, todayStr]);

            return (
                <div className="space-y-6 pb-12 animate-fade-in">
                    <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-[#26262d] flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="serif-font text-xl font-extrabold text-white">Jadwal Follow-Up & Reminders (Asia/Jakarta)</h2>
                            <p className="text-sm text-zinc-400 mt-1">Sistem pengingat berkala untuk mengawal proses closing penjualan.</p>
                        </div>
                        <button 
                            onClick={() => {
                                const res = ExportService.exportToCSV('followup', followUpTasks);
                                if (res.success) showToast("File CSV Follow-Up berhasil diunduh!");
                                else setFollowUpError("Gagal mengunduh file ekspor: " + res.error);
                            }}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-emerald-600/25 transition-all w-full md:w-auto justify-center"
                        >
                            <Icons.FileSpreadsheet /> Export CSV Jadwal
                        </button>
                    </div>

                    <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-[#26262d] space-y-4">
                        <h3 className="text-sm font-bold uppercase tracking-wider text-zinc-300">Tambah Tugas Follow-Up Baru</h3>
                        {followUpError && (
                            <div className="p-3 bg-rose-950/80 border border-rose-800 text-rose-200 rounded-xl text-xs font-semibold" role="alert">
                                ⚠️ {followUpError}
                            </div>
                        )}
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-6 gap-3">
                            <select
                                value={selectedLeadId}
                                onChange={handleLeadSelect}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-3 py-2.5 text-xs text-zinc-300 sm:col-span-1 md:col-span-1"
                            >
                                <option value="">-- Pilih dari CRM --</option>
                                {crmLeads.map(l => (
                                    <option key={l.id} value={l.id}>{l.name}</option>
                                ))}
                            </select>
                            <input 
                                type="text" 
                                placeholder="Nama Klien..." 
                                value={newFollowClient}
                                onChange={(e) => setNewFollowClient(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <input 
                                type="text" 
                                placeholder="No WA (08...)" 
                                value={newFollowPhone}
                                onChange={(e) => setNewFollowPhone(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <input 
                                type="text" 
                                placeholder="Jenis Tugas (mis. Survey H+1)" 
                                value={newFollowType}
                                onChange={(e) => setNewFollowType(e.target.value)}
                                className="bg-[#15151a] border border-[#26262d] rounded-xl px-4 py-2.5 text-sm text-white shadow-inner placeholder:text-zinc-600 sm:col-span-1 md:col-span-1"
                            />
                            <div className="sm:col-span-1 md:col-span-1 space-y-1">
                                <div className="flex items-center gap-1">
                                    <input 
                                        type="date"
                                        value={newFollowDue}
                                        onChange={(e) => setNewFollowDue(e.target.value)}
                                        className="bg-[#15151a] border border-[#26262d] rounded-xl px-2.5 py-2 text-xs text-zinc-200 shadow-inner w-full"
                                    />
                                    {newFollowDue && (
                                        <button 
                                            type="button" 
                                            onClick={() => setNewFollowDue('')}
                                            className="px-1.5 py-1 text-zinc-500 hover:text-zinc-300 text-xs"
                                            title="Kosongkan tanggal"
                                        >
                                            ✕
                                        </button>
                                    )}
                                </div>
                                <div className="flex items-center gap-1 overflow-x-auto text-[10px]">
                                    <button 
                                        type="button" 
                                        onClick={() => setNewFollowDue(Utils.getAsiaJakartaDate())}
                                        className="px-1.5 py-0.5 bg-[#202028] hover:bg-[#282832] text-[#c5a059] rounded border border-[#2e2e38] whitespace-nowrap font-medium"
                                        title="Set Hari Ini"
                                    >
                                        Hari Ini
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setNewFollowDue(Utils.addDaysToDate(Utils.getAsiaJakartaDate(), 1))}
                                        className="px-1.5 py-0.5 bg-[#202028] hover:bg-[#282832] text-zinc-300 rounded border border-[#2e2e38] whitespace-nowrap font-medium"
                                        title="Set Besok"
                                    >
                                        +Besok
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setNewFollowDue(Utils.addDaysToDate(Utils.getAsiaJakartaDate(), 3))}
                                        className="px-1.5 py-0.5 bg-[#202028] hover:bg-[#282832] text-zinc-300 rounded border border-[#2e2e38] whitespace-nowrap font-medium"
                                        title="Set +3 Hari"
                                    >
                                        +3 H
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setNewFollowDue(Utils.addDaysToDate(Utils.getAsiaJakartaDate(), 7))}
                                        className="px-1.5 py-0.5 bg-[#202028] hover:bg-[#282832] text-zinc-300 rounded border border-[#2e2e38] whitespace-nowrap font-medium"
                                        title="Set +1 Minggu"
                                    >
                                        +1 M
                                    </button>
                                </div>
                            </div>
                            <button 
                                onClick={handleAddTask}
                                disabled={isAddingTask}
                                className="gold-btn px-4 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-lg shadow-[#c5a059]/25 sm:col-span-1 md:col-span-1"
                            >
                                {isAddingTask ? 'Menyimpan...' : <React.Fragment><Icons.Plus /> Simpan</React.Fragment>}
                            </button>
                        </div>
                    </div>

                    <div className="bg-[#15151a] rounded-3xl p-4 md:p-6 shadow-2xl border border-[#26262d] flex items-center justify-between gap-4 flex-wrap">
                        <div className="relative flex-1 max-w-md">
                            <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                                <Icons.Search />
                            </span>
                            <input 
                                type="text"
                                placeholder="Cari nama klien atau tugas..."
                                value={followUpSearch}
                                onChange={(e) => setFollowUpSearch(e.target.value)}
                                className="w-full pl-10 pr-4 py-2.5 bg-[#1b1b22] border border-[#26262d] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#c5a059]/30 font-medium text-white placeholder:text-zinc-600"
                            />
                        </div>

                        <div className="flex items-center gap-2 flex-wrap">
                            {[
                                { id: 'Semua', label: 'Semua' },
                                { id: 'Terlambat', label: `Terlambat (${overdueCount})` },
                                { id: 'Hari Ini', label: `Hari Ini (${todayCount})` },
                                { id: 'Mendatang', label: 'Mendatang' },
                                { id: 'Perlu Jadwal Ulang', label: `Perlu Jadwal Ulang (${rescheduleCount})` },
                                { id: 'Selesai', label: `Selesai (${completedCount})` }
                            ].map(f => (
                                <button 
                                    key={f.id}
                                    onClick={() => setTaskFilter(f.id)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                        taskFilter === f.id 
                                            ? (f.id === 'Terlambat' ? 'bg-rose-900 text-white' : f.id === 'Perlu Jadwal Ulang' ? 'bg-purple-900 text-white' : 'bg-[#c5a059] text-[#0d0d0d]') 
                                            : 'bg-[#202028] text-zinc-400 hover:text-white'
                                    }`}
                                >
                                    {f.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Follow-Up Content (Fixed Empty State Outside Grid) */}
                    {followUpTasks.length === 0 ? (
                        <div className="w-full py-16 text-center text-zinc-500 glass-panel rounded-3xl flex flex-col items-center justify-center">
                            <div className="w-12 h-12 bg-[#202028] rounded-2xl flex items-center justify-center text-zinc-500 mb-3">
                                <Icons.LayoutDashboard />
                            </div>
                            <p className="font-bold text-zinc-300">Belum ada tugas follow-up.</p>
                            <p className="text-xs text-zinc-500 mt-1">Tambahkan jadwal menggunakan form di atas.</p>
                        </div>
                    ) : filteredTasks.length === 0 ? (
                        <div className="w-full py-16 text-center text-zinc-500 glass-panel rounded-3xl flex flex-col items-center justify-center">
                            <p className="font-bold text-zinc-300">Tidak ada tugas yang sesuai dengan filter "{taskFilter}".</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredTasks.map((task) => {
                                const displayPhone = PhoneUtils.formatDisplay(task.phoneRaw, task.phoneNormalized);
                                const hasValidWa = !!task.phoneNormalized;
                                const isOverdue = task.status !== 'Selesai' && task.dueDate && task.dueDate < todayStr;
                                const isToggling = togglingTaskIds.has(task.id);

                                return (
                                    <div key={task.id} className={`bg-[#15151a] rounded-3xl p-6 border shadow-2xl flex flex-col justify-between transition-all ${
                                        isOverdue ? 'border-rose-900/60 bg-rose-950/10' : 'border-[#26262d]'
                                    }`}>
                                        <div>
                                            <div className="flex justify-between items-center mb-4">
                                                {task.needsReschedule || !task.dueDate ? (
                                                    <span className="text-xs font-bold px-3 py-1 bg-purple-950 text-purple-300 rounded-xl border border-purple-800">
                                                        ⚠️ Perlu dijadwalkan ulang
                                                    </span>
                                                ) : (
                                                    <span className={`text-xs font-bold px-3 py-1 rounded-xl border ${
                                                        isOverdue ? 'bg-rose-950 text-rose-300 border-rose-800' : 'bg-[#202028] text-[#c5a059] border-[#2e2e38]'
                                                    }`}>
                                                        📅 {task.dueDate} {isOverdue && '(TERLAMBAT)'}
                                                    </span>
                                                )}
                                                <StatusBadge status={task.status} />
                                            </div>
                                            
                                            <h3 className="serif-font font-extrabold text-white text-lg flex items-center justify-between">
                                                {task.client}
                                                {task.leadId && <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-[#202028] text-zinc-400 border border-[#2e2e38]">CRM Linked</span>}
                                                {task.isDetachedFromDeletedLead && <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700" title="Data klien telah dihapus dari CRM, tugas tetap disimpan secara mandiri">Standalone</span>}
                                            </h3>
                                            <p className="text-xs text-zinc-400 mt-0.5">WA: {displayPhone}</p>
                                            <p className="text-sm text-zinc-300 mt-2.5 font-semibold bg-[#1b1b22] p-3 rounded-xl border border-[#26262d]">{task.type}</p>
                                        </div>

                                        <div className="mt-6 pt-4 border-t border-[#26262d] flex justify-between items-center gap-2">
                                            <button 
                                                onClick={() => handleToggleTaskStatus(task)}
                                                disabled={isToggling}
                                                className="text-xs font-bold text-[#c5a059] hover:underline bg-[#202028] px-3 py-1.5 rounded-xl border border-[#2e2e38] transition-colors disabled:opacity-50"
                                            >
                                                {isToggling ? 'Menyimpan...' : task.status === 'Selesai' ? 'Tandai Pending' : 'Tandai Selesai'}
                                            </button>

                                            <div className="flex items-center gap-1.5">
                                                {hasValidWa ? (
                                                    <a 
                                                        href={PhoneUtils.buildWaLink(task.phoneNormalized, task.client)}
                                                        target="_blank"
                                                        rel="noreferrer"
                                                        className="text-xs font-bold text-emerald-300 bg-emerald-950 px-3 py-1.5 rounded-xl border border-emerald-800 hover:bg-emerald-900 transition-colors flex items-center gap-1"
                                                    >
                                                        WA
                                                    </a>
                                                ) : (
                                                    <button 
                                                        disabled
                                                        className="text-xs font-bold text-zinc-600 bg-[#1b1b22] px-3 py-1.5 rounded-xl border border-[#26262d] cursor-not-allowed opacity-50"
                                                        title="Nomor WhatsApp belum diisi atau tidak valid"
                                                    >
                                                        WA
                                                    </button>
                                                )}
                                                <button 
                                                    onClick={() => setEditingTask(task)}
                                                    className="text-zinc-400 hover:text-white text-xs font-semibold p-1.5 rounded-lg hover:bg-[#202028]"
                                                    aria-label={`Edit tugas ${task.client}`}
                                                >
                                                    <Icons.Edit />
                                                </button>
                                                <button 
                                                    onClick={() => setDeleteTaskId(task.id)}
                                                    className="text-zinc-500 hover:text-rose-400 text-xs font-semibold p-1.5 rounded-lg hover:bg-rose-950/40"
                                                    aria-label={`Hapus tugas ${task.client}`}
                                                >
                                                    <Icons.Trash />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <EditTaskModal 
                        isOpen={!!editingTask}
                        task={editingTask}
                        crmLeads={crmLeads}
                        onSave={handleUpdateTask}
                        onCancel={() => setEditingTask(null)}
                    />

                    <ConfirmModal 
                        isOpen={!!deleteTaskId}
                        title="Hapus Tugas Follow-Up"
                        message="Apakah Anda yakin ingin menghapus jadwal tugas ini? Data tidak akan dibangkitkan kembali oleh sinkronisasi cloud."
                        onConfirm={confirmDeleteTask}
                        onCancel={() => setDeleteTaskId(null)}
                        isLoading={isDeletingTask}
                    />
                </div>
            );
        };

        // =========================================================================
        // 11. FEATURE MODULE 4: KNOWLEDGE BASE
        // =========================================================================
        const KnowledgeBase = () => {
            const kbItems = [
                { category: "SOP & Garansi", title: "Layanan End-to-End & Garansi 6 Bulan", desc: `${PRICE_MASTER.services.join(', ')}. Garansi pemeliharaan berlaku penuh selama 6 bulan pasca serah terima kunci.` },
                { category: "Kitchen Set (Bandung)", title: "Pricelist Kitchen Set Bandung & Tasikmalaya", desc: PRICE_MASTER.kitchenBandung.map(k => `${k.material} ${k.display}`).join(', ') },
                { category: "Kitchen Set (Jabodetabek)", title: "Pricelist Kitchen Set Jabodetabek & Jateng", desc: PRICE_MASTER.kitchenJabodetabek.map(k => `${k.material} ${k.display}`).join(', ') },
                { category: "Kamar Set & Wardrobe", title: "Pricelist Lemari, Dipan & Meja Rias", desc: `Lemari Minimalis Blockboard mulai ${PRICE_MASTER.wardrobe[0].display} (Bandung) & ${PRICE_MASTER.wardrobe[1].display} (Jabodetabek). Finishing HPL, Melaminto, atau Duco Klasik.` },
                { category: "Living Room", title: "Backdrop TV, Partisi & Wallpanel WPC", desc: `${PRICE_MASTER.livingRoom[0].item} ${PRICE_MASTER.livingRoom[0].display}, ${PRICE_MASTER.livingRoom[1].item} ${PRICE_MASTER.livingRoom[1].display}, ${PRICE_MASTER.livingRoom[2].item} ${PRICE_MASTER.livingRoom[2].display}.` },
                { category: "Material Specs", title: "Spesifikasi Material Utama Nacira Studio", desc: PRICE_MASTER.specifications }
            ];

            return (
                <div className="space-y-6 pb-12 animate-fade-in">
                    <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-2xl border border-[#26262d] flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h2 className="serif-font text-xl font-extrabold text-white">Knowledge Base & Pricelist Resmi</h2>
                            <p className="text-sm text-zinc-400 mt-1">Master database spesifikasi material, garansi, dan tarif interior Nacira Studio 2026.</p>
                        </div>
                        <span className="px-4 py-2 bg-[#202028] text-[#c5a059] font-bold text-xs rounded-xl border border-[#33333d] shadow-sm">
                            {kbItems.length} Modul Aktif
                        </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {kbItems.map((item, idx) => (
                            <div key={idx} className="bg-[#15151a] rounded-3xl p-6 border border-[#26262d] shadow-2xl flex flex-col justify-between hover:border-[#c5a059]/50 transition-all">
                                <div>
                                    <span className="text-xs font-extrabold px-3 py-1 bg-[#202028] text-[#c5a059] rounded-xl inline-block mb-4 border border-[#2e2e38]">
                                        {item.category}
                                    </span>
                                    <h3 className="serif-font font-extrabold text-white text-base">{item.title}</h3>
                                    <p className="text-sm text-zinc-400 mt-2.5 leading-relaxed font-medium">{item.desc}</p>
                                </div>
                                <div className="mt-6 pt-4 border-t border-[#26262d] flex justify-between items-center text-xs">
                                    <span className="text-zinc-500 font-medium">Terhubung ke AI Engine</span>
                                    <span className="text-emerald-400 font-bold flex items-center gap-1 bg-emerald-950 px-2.5 py-1 rounded-lg border border-emerald-800">
                                        <Icons.CheckCircle /> Verified
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 12. ERROR BOUNDARY
        // =========================================================================
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("[ErrorBoundary] Tangkapan error render:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-[100dvh] bg-[#0d0d0d] text-white p-8 flex flex-col items-center justify-center">
                            <div className="glass-panel p-8 rounded-3xl max-w-md w-full text-center border border-rose-800 space-y-4">
                                <div className="w-12 h-12 bg-rose-950 text-rose-400 rounded-2xl flex items-center justify-center mx-auto">
                                    <Icons.AlertTriangle />
                                </div>
                                <h2 className="serif-font text-xl font-bold text-white">Terjadi Kesalahan Aplikasi</h2>
                                <p className="text-xs text-zinc-400 bg-[#15151a] p-3 rounded-xl border border-[#26262d] text-left overflow-auto max-h-32">
                                    {this.state.error?.toString()}
                                </p>
                                <div className="space-y-2 pt-2">
                                    <button 
                                        onClick={() => window.location.reload()} 
                                        className="gold-btn px-6 py-2.5 rounded-xl text-xs font-bold w-full"
                                    >
                                        Muat Ulang Aplikasi
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // =========================================================================
        // 13. TOP-LEVEL APP (ORCHESTRATOR)
        // =========================================================================
        function App() {
            const [activeTab, setActiveTab] = useState('workspace');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [toast, setToast] = useState(null);
            const toastTimerRef = useRef(null);

            const [userId, setUserId] = useState(null);
            const [syncStatus, setSyncStatus] = useState(() => {
                return window.firebaseServices?.isConfigured ? 'checking' : 'local';
            });
            const [showCloudModal, setShowCloudModal] = useState(false);
            const [firebaseConfigState, setFirebaseConfigState] = useState(() => {
                return window.firebaseServices?.getActiveConfig?.() || null;
            });

            const showToast = useCallback((message, type = 'info') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast(null);
                }, 3500);
            }, []);

            useEffect(() => {
                return () => {
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                };
            }, []);

            const [crmLeads, setCrmLeads] = useState(() => {
                const { leads } = MigrationService.loadUserData(null);
                return leads;
            });

            const [followUpTasks, setFollowUpTasks] = useState(() => {
                const { tasks } = MigrationService.loadUserData(null);
                return tasks;
            });

            // Storage synchronization
            useEffect(() => {
                const key = StorageService.getUserKey(MigrationService.BASE_KEYS.CRM_LEADS, userId);
                const res = StorageService.setItem(key, crmLeads);
                if (!res.success && res.isQuotaExceeded) {
                    showToast("Peringatan: Kuota penyimpanan browser penuh! Segera ekspor data ke CSV.", "error");
                }
            }, [crmLeads, userId, showToast]);

            useEffect(() => {
                const key = StorageService.getUserKey(MigrationService.BASE_KEYS.FOLLOWUP_TASKS, userId);
                const res = StorageService.setItem(key, followUpTasks);
                if (!res.success && res.isQuotaExceeded) {
                    showToast("Peringatan: Kuota penyimpanan browser penuh! Segera ekspor data ke CSV.", "error");
                }
            }, [followUpTasks, userId, showToast]);

            // Firebase Lifecycle & Real-Time Sync
            useEffect(() => {
                let unsubAuth = null;
                let unsubLeadsSnapshot = null;
                let unsubTasksSnapshot = null;
                let isMounted = true;

                const connectFirebase = async () => {
                    if (!window.firebaseServices || !window.firebaseServices.isConfigured) {
                        if (isMounted) setSyncStatus('local');
                        return;
                    }

                    const { auth, db, appId, signInAnonymously, onAuthStateChanged, collection, onSnapshot } = window.firebaseServices;

                    if (!auth || !db) {
                        if (isMounted) setSyncStatus('local');
                        return;
                    }

                    if (isMounted) setSyncStatus('checking');

                    try {
                        await signInAnonymously(auth);
                    } catch (authErr) {
                        console.warn("[App] Auth error:", authErr);
                        if (isMounted) {
                            if (authErr.code === 'auth/unauthorized-domain') {
                                setSyncStatus('error');
                                showToast(`Domain "${window.location.hostname}" belum diizinkan di Firebase Console. Buka Pengaturan Cloud untuk instruksi.`, "error");
                            } else {
                                setSyncStatus('local');
                            }
                        }
                    }

                    unsubAuth = onAuthStateChanged(auth, (user) => {
                        if (!isMounted) return;

                        if (user) {
                            setUserId(user.uid);

                            const userLocalData = MigrationService.loadUserData(user.uid);
                            setCrmLeads(userLocalData.leads);
                            setFollowUpTasks(userLocalData.tasks);

                            const leadsCol = collection(db, 'artifacts', appId, 'users', user.uid, 'crmLeads');
                            unsubLeadsSnapshot = onSnapshot(leadsCol, (snapshot) => {
                                if (!isMounted) return;
                                const cloudItems = [];
                                snapshot.forEach(docSnap => cloudItems.push(docSnap.data()));

                                const tombstones = MigrationService.getTombstones('leads', user.uid);
                                setCrmLeads(prev => MigrationService.reconcileCloudData(prev, cloudItems, tombstones));
                                setSyncStatus('synced');
                            }, (err) => {
                                console.warn("[App] Leads snapshot error:", err);
                                if (isMounted) setSyncStatus('error');
                            });

                            const tasksCol = collection(db, 'artifacts', appId, 'users', user.uid, 'followUpTasks');
                            unsubTasksSnapshot = onSnapshot(tasksCol, (snapshot) => {
                                if (!isMounted) return;
                                const cloudTasks = [];
                                snapshot.forEach(docSnap => cloudTasks.push(docSnap.data()));

                                const tombstones = MigrationService.getTombstones('tasks', user.uid);
                                setFollowUpTasks(prev => MigrationService.reconcileCloudData(prev, cloudTasks, tombstones));
                            }, (err) => {
                                console.warn("[App] Tasks snapshot error:", err);
                            });

                        } else {
                            setUserId(null);
                            setSyncStatus('local');
                        }
                    });
                };

                connectFirebase();

                const handleReconfigured = () => {
                    if (isMounted) {
                        setFirebaseConfigState(window.firebaseServices.getActiveConfig());
                        connectFirebase();
                    }
                };

                window.addEventListener('firebase-ready', connectFirebase);
                window.addEventListener('firebase-reconfigured', handleReconfigured);

                return () => {
                    isMounted = false;
                    window.removeEventListener('firebase-ready', connectFirebase);
                    window.removeEventListener('firebase-reconfigured', handleReconfigured);
                    if (unsubAuth) unsubAuth();
                    if (unsubLeadsSnapshot) unsubLeadsSnapshot();
                    if (unsubTasksSnapshot) unsubTasksSnapshot();
                };
            }, [showToast]);

            const handleSaveCloudConfig = (config) => {
                if (window.firebaseServices?.reconfigure) {
                    const res = window.firebaseServices.reconfigure(config);
                    setFirebaseConfigState(config);
                    if (res.isConfigured) {
                        showToast("Konfigurasi Firebase diterapkan! Memeriksa koneksi...", "info");
                    } else {
                        setSyncStatus('local');
                        showToast("Beralih ke mode penyimpanan lokal.", "info");
                    }
                }
            };

            const handleForceLocal = () => {
                handleSaveCloudConfig(null);
                setShowCloudModal(false);
            };

            const todayStr = Utils.getAsiaJakartaDate();
            const overdueCount = useMemo(() => followUpTasks.filter(t => t.status !== 'Selesai' && t.dueDate && t.dueDate < todayStr).length, [followUpTasks, todayStr]);
            const todayCount = useMemo(() => followUpTasks.filter(t => t.dueDate === todayStr && t.status !== 'Selesai').length, [followUpTasks, todayStr]);
            const rescheduleCount = useMemo(() => followUpTasks.filter(t => t.needsReschedule || (!t.dueDate && t.status !== 'Selesai')).length, [followUpTasks]);

            return (
                <AppShell
                    isSidebarOpen={isSidebarOpen}
                    setIsSidebarOpen={setIsSidebarOpen}
                    activeTab={activeTab}
                    setActiveTab={setActiveTab}
                    syncStatus={syncStatus}
                    onOpenCloudModal={() => setShowCloudModal(true)}
                    overdueCount={overdueCount}
                    todayCount={todayCount}
                    rescheduleCount={rescheduleCount}
                >
                    <Toast toast={toast} />

                    {activeTab === 'workspace' && <AIWorkspace showToast={showToast} />}
                    {activeTab === 'crm' && <CRMModule crmLeads={crmLeads} setCrmLeads={setCrmLeads} followUpTasks={followUpTasks} setFollowUpTasks={setFollowUpTasks} userId={userId} showToast={showToast} />}
                    {activeTab === 'followup' && <FollowUpModule followUpTasks={followUpTasks} setFollowUpTasks={setFollowUpTasks} crmLeads={crmLeads} userId={userId} showToast={showToast} />}
                    {activeTab === 'knowledge' && <KnowledgeBase />}

                    <CloudSettingsModal 
                        isOpen={showCloudModal}
                        onClose={() => setShowCloudModal(false)}
                        onSaveConfig={handleSaveCloudConfig}
                        currentConfig={firebaseConfigState}
                        syncStatus={syncStatus}
                        onForceLocalMode={handleForceLocal}
                    />
                </AppShell>
            );
        }

        // =========================================================================
        // 14. APPLICATION BOOTSTRAP
        // =========================================================================
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        }
    </script>
</body>
</html>
